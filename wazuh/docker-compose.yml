services:
  wazuh.manager:
    build:
      context: .
      dockerfile: Dockerfile.manager
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - suricata_logs:/var/log/suricata:ro
      # NIDS real sobre a interface de rede de verdade do Mac (en7) — via
      # Suricata nativo (brew, fora do Docker), não outro container: Docker
      # Desktop no macOS nunca expõe a NIC real do host a um container (raiz
      # de tudo isso — ver comentário do wazuh.agent acima para a mesma
      # limitação com logs nativos). Roda fora do docker-compose porque
      # captura de pacote (`-i en7`) exige acesso a interface real, que só
      # existe fora da VM do Docker Desktop. Ver README/wazuh/ para o comando
      # (`sudo suricata ...`) — só o usuário consegue rodar, exige senha.
      - ./host-suricata-logs:/var/log/suricata-host:ro
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "8443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

  # Agente local: se auto-registra no manager (authd, porta 1515), roda o
  # wodle syscollector (network=yes, já habilitado por padrão na imagem) para
  # reportar a topologia/tráfego de rede local do ambiente Docker, e monitora
  # arquivos REAIS da máquina do usuário (macOS) via bind mount read-only —
  # não é possível ler o log de auth/sistema nativo do macOS (unified
  # logging não é um arquivo texto acessível de dentro de um container Linux;
  # exigiria um agente nativo instalado no host, fora do escopo do Docker).
  wazuh.agent:
    image: wazuh/wazuh-agent:4.14.7
    hostname: cyber-soc-local-net
    restart: always
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_AGENT_NAME=cyber-soc-local-net
      - WAZUH_REGISTRATION_SERVER=wazuh.manager
    volumes:
      - ./config/wazuh_agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf
      - ${HOME}/Library/Logs:/host-mac-logs:ro
      - ${HOME}/.zsh_history:/host-mac-history/.zsh_history:ro
    depends_on:
      - wazuh.manager
    links:
      - wazuh.manager:wazuh.manager

  # ATENÇÃO — `network_mode: service:wazuh.manager` prende este container ao
  # ID do container do manager NO MOMENTO EM QUE ESTE SOBE, não ao serviço
  # por nome: um `docker compose up -d wazuh.manager`/`restart` que troque o
  # ID por baixo (recreate) deixa este container preso a um namespace de
  # rede órfão — ele sobe normal, mas só enxerga `lo` (bug real observado:
  # ficou "capturando" nada por um bom tempo sem erro nenhum). Sempre que
  # `wazuh.manager` for recriado, recrie este também: `docker compose stop
  # suricata && docker compose rm -f suricata && docker compose up -d
  # suricata` (um `restart` sozinho não resolve, porque não troca o
  # `network_mode` já resolvido). Verificação rápida: `docker compose exec
  # suricata cat /proc/net/dev` tem que listar `eth0`, não só `lo`.
  #
  # NIDS real sobre o tráfego do wazuh.manager (registro/keepalive de agentes
  # em 1514/1515, syslog em 514, consultas à API em 55000) — sem isso, "Wazuh
  # não está analisando tráfego de rede" era literal: os 378 alertas mais
  # recentes eram 100% SCA/rootcheck/syscheck (host), nenhum trazia
  # srcip/dstip. Wazuh puro é HIDS, nunca observou um pacote/conexão de
  # verdade. Compartilha o namespace de rede do wazuh.manager
  # (`network_mode: service:`) porque é a única interface que um container
  # consegue capturar sem tocar o host (Docker Desktop no macOS não expõe a
  # NIC real do laptop — mesma limitação documentada no comentário do
  # wazuh.agent acima para logs nativos do macOS). Ruleset real (ET-Open via
  # `suricata-update`, não fabricado); saída eve.json lida pelo Wazuh via o
  # decoder/ruleset padrão que ele já traz
  # (ruleset/rules/0475-suricata_rules.xml, decoded_as=json) — ver
  # <localfile> em config/wazuh_cluster/wazuh_manager.conf. O `sed` abaixo
  # remove o tipo `stats` do eve-log (contador de performance interno do
  # Suricata, não um evento de segurança) — a versão flatten dele tem tantos
  # campos que o decoder JSON do wazuh-analysisd rejeitava a linha inteira
  # ("Too many fields for JSON decoder"), derrubando também os eventos reais
  # (alert/flow/dns/tls) que vinham no mesmo arquivo. `-k none` desliga a
  # validação de checksum na captura (flag documentada do Suricata) — mas as
  # regras "SURICATA {TCP,UDP,ICMP}v{4,6} invalid checksum" (decoder-events.
  # rules, SIDs 2200073-2200079) são assinaturas de verdade, carregadas como
  # qualquer outra, então `-k` sozinho não as desliga; ver
  # config/suricata/disable.conf. Sem isso, eram a esmagadora maioria dos
  # "alertas" (checksum real só é calculado pela NIC/driver do host depois
  # que o Suricata já capturou o pacote na veth — todo pacote de saída
  # aparenta "errado" mesmo sendo tráfego 100% normal; chegou a 600+ no
  # mesmo par de IPs em minutos).
  suricata:
    image: jasonish/suricata:latest
    restart: unless-stopped
    network_mode: "service:wazuh.manager"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    entrypoint: >
      /bin/sh -c "
      mkdir -p /etc/suricata &&
      cp -an /etc/suricata.dist/* /etc/suricata/ &&
      sed -i '/^        - stats:$/,/^        # bi-directional flows$/{/^        # bi-directional flows$/!d}' /etc/suricata/suricata.yaml &&
      (suricata-update --no-test || echo 'suricata-update falhou, seguindo com o ruleset padrão da imagem') &&
      cat /var/lib/suricata/rules/local.rules >> /var/lib/suricata/rules/suricata.rules &&
      exec /docker-entrypoint.sh -i eth0 -k none not host 192.168.65.254
      "
    volumes:
      - suricata_logs:/var/log/suricata
      - suricata_rules:/var/lib/suricata
      - suricata_etc:/etc/suricata
      # Sem `:ro`: o /docker-entrypoint.sh da imagem roda `chown -R
      # suricata:suricata /etc/suricata` (fix_perms) sob `set -e` — montado
      # somente-leitura, o chown falha e derruba o container inteiro num
      # crash loop (observado). O arquivo em si só é lido pelo
      # suricata-update; permissão de escrita no mount não muda o arquivo
      # real no host.
      - ./config/suricata/disable.conf:/etc/suricata/disable.conf
      # Regra autoral de varredura de portas (config/suricata/local.rules) —
      # `suricata-update` nunca toca `local.rules` (só reescreve o
      # `suricata.rules` gerenciado), então persiste sem novo `-an` a cada
      # restart; ver o `sed` acima que a registra em `rule-files:`.
      - ./config/suricata/local.rules:/var/lib/suricata/rules/local.rules
    depends_on:
      - wazuh.manager

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  suricata_logs:
  suricata_rules:
  suricata_etc:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
