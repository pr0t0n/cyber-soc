# Lido por `suricata-update` (padrão: /etc/suricata/disable.conf) ao gerar
# /var/lib/suricata/rules/suricata.rules.
#
# SIDs 2200073-2200079 (decoder-events.rules): "invalid checksum" para
# IPv4/TCPv4/UDPv4/ICMPv4/TCPv6/UDPv6/ICMPv6. Dentro de Docker/VM, o
# checksum real só é preenchido pela NIC/driver do host DEPOIS que o
# Suricata já capturou o pacote na interface virtual (veth) — ou seja, todo
# pacote de saída aparenta ter checksum "errado", mesmo sendo tráfego 100%
# normal. `-k none` (flag de captura) não desliga isso porque estas são
# regras de assinatura de verdade (`tcpv4-csum:invalid` etc.), carregadas
# como qualquer outra do ruleset — precisam ser desabilitadas aqui, não na
# linha de comando. Chegou a gerar 600+ "alertas" para o mesmo par de IPs em
# minutos antes desta correção.
2200073
2200074
2200075
2200076
2200077
2200078
2200079
