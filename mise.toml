[tools]
bun = "latest"
uv = "latest"

# Recommended local-dev path: everything containerized, nothing installed on the
# host. front:dev/back:dev below use host uv/bun and exist only because
# cyber-specs/02-processo/stack.md requires those task names to be present.
[tasks.dev]
run = "docker compose up --build"

[tasks."dev:test"]
run = "docker compose --profile test run --rm test"

[tasks.install]
run = ["bun install --cwd frontend", "uv sync --project backend"]

[tasks."front:dev"]
run = "bun run dev"
dir = "frontend"

[tasks."back:dev"]
run = "uv run uvicorn app.main:app --reload --port 8000"
dir = "backend"

[tasks.test]
run = ["uv run --project backend --extra dev pytest -q -c backend/pyproject.toml backend/tests"]

[tasks."test:backend"]
run = "uv run --extra dev pytest -q"
dir = "backend"

[tasks.build]
run = "bun run build"
dir = "frontend"

[tasks."ci:check"]
run = ["mise run install", "mise run test", "mise run build"]
